<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(pageTitle, backUrl, backLabel, content)">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle} ?: 'Internet Market'">Internet Market</title>

    <!-- ✅ Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" th:href="@{/categories}">Internet Market</a>

        <div class="d-flex align-items-center gap-2">

            <!-- Back button -->
            <a class="btn btn-outline-light btn-sm"
               th:if="${backUrl != null}"
               th:href="${backUrl}"
               th:text="${backLabel} ?: 'Back'">Back</a>

            <!-- Admin -->
            <a class="btn btn-outline-warning btn-sm"
               sec:authorize="hasAuthority('ADMIN')"
               th:href="@{/admin/home}">Admin</a>

            <!-- Login/Logout -->
            <a class="btn btn-outline-info btn-sm"
               sec:authorize="isAnonymous()"
               th:href="@{/loginPage}">Login</a>

            <form sec:authorize="isAuthenticated()"
                  th:action="@{/logout}" method="post" class="m-0">
                <button class="btn btn-outline-danger btn-sm" type="submit">Logout</button>
            </form>
        </div>

    </div>
</nav>

<main class="container py-4" th:insert="${content}">
    <!-- page content -->
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
