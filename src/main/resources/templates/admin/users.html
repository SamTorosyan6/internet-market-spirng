<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">

    <div class="d-flex justify-content-between mb-3">
        <h2>Users</h2>

        <form th:action="@{/logout}" method="post">
            <button class="btn btn-danger btn-sm">Logout</button>
        </form>
    </div>

    <!-- Add user form -->
    <div class="card mb-4">
        <div class="card-body">
            <form th:action="@{/admin/users/add}" method="post" th:object="${newUser}">
                <div class="row">
                    <div class="col-md-3">
                        <input class="form-control" th:field="*{name}" placeholder="Name" required>
                    </div>
                    <div class="col-md-3">
                        <input class="form-control" th:field="*{surname}" placeholder="Surname" required>
                    </div>
                    <div class="col-md-3">
                        <input class="form-control" th:field="*{email}" placeholder="Email" required>
                    </div>
                    <div class="col-md-3">
                        <input type="password" class="form-control" th:field="*{password}" placeholder="Password" required>
                    </div>
                </div>

                <div class="mt-2">
                    <select class="form-select w-25" th:field="*{userType}">
                        <option th:value="USER">USER</option>
                        <option th:value="ADMIN">ADMIN</option>
                    </select>
                </div>

                <button class="btn btn-dark mt-2">Add User</button>
            </form>
        </div>
    </div>

    <!-- Users table -->
    <table class="table table-bordered bg-white">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Type</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.id}"></td>
            <td th:text="${u.name + ' ' + u.surname}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${u.userType}"></td>
            <td>
                <a class="btn btn-sm btn-danger"
                   th:href="@{/admin/users/delete(id=${u.id})}">
                    Delete
                </a>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
