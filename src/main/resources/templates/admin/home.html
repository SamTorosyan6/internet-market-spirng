<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h2 class="mb-4">Admin Panel</h2>

    <div class="row g-3">
        <div class="col-md-4">
            <a class="card shadow-sm text-decoration-none" th:href="@{/admin/categories}">
                <div class="card-body">
                    <h5>Categories</h5>
                    <p class="text-muted mb-0">Create / delete categories</p>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a class="card shadow-sm text-decoration-none" th:href="@{/admin/products}">
                <div class="card-body">
                    <h5>Products</h5>
                    <p class="text-muted mb-0">Add / delete products + upload image</p>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a class="card shadow-sm text-decoration-none" th:href="@{/admin/users}">
                <div class="card-body">
                    <h5>Users</h5>
                    <p class="text-muted mb-0">View all users</p>
                </div>
            </a>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-danger btn-sm" type="submit">Logout</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
