<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Admin Home', null, null, ~{::section})}">

<section>

    <h2 class="mb-4">Admin Panel</h2>

    <div class="row g-3">
        <div class="col-md-4">
            <a class="card shadow-sm text-decoration-none" th:href="@{/admin/categories}">
                <div class="card-body">
                    <h5>Categories</h5>
                    <p class="text-muted mb-0">Create / edit / delete categories</p>
                </div>
            </a>
        </div>

        <div class="col-md-4">
            <a class="card shadow-sm text-decoration-none" th:href="@{/admin/products}">
                <div class="card-body">
                    <h5>Products</h5>
                    <p class="text-muted mb-0">Add / edit / delete products + upload image</p>
                </div>
            </a>
        </div>

        <div class="col-md-4">
            <a class="card shadow-sm text-decoration-none" th:href="@{/admin/users}">
                <div class="card-body">
                    <h5>Users</h5>
                    <p class="text-muted mb-0">View / add / delete users</p>
                </div>
            </a>
        </div>
    </div>

</section>
</html>
