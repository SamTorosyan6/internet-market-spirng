<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title th:text="#{admin.products}">Products</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 th:text="#{admin.products}">Products</h3>

        <div class="d-flex gap-2">
            <a class="btn btn-dark"
               th:href="@{/admin/products/add}"
               th:text="#{admin.addProduct}">
                Add product
            </a>

            <a class="btn btn-outline-dark"
               th:href="@{/admin/home}"
               th:text="#{layout.back}">
                Back
            </a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th th:text="#{admin.image}">Image</th>
                    <th th:text="#{admin.title}">Title</th>
                    <th th:text="#{admin.price}">Price</th>
                    <th th:text="#{admin.category}">Category</th>
                    <th class="text-end" th:text="#{admin.action}">Action</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="p : ${products}">
                    <td style="width:90px">
                        <img th:if="${p.picName}"
                             th:src="@{/image/get(picName=${p.picName})}"
                             style="width:70px;height:50px;object-fit:cover;border-radius:8px"/>
                    </td>

                    <td th:text="${p.title}"></td>
                    <td th:text="${p.price}"></td>
                    <td th:text="${p.category != null ? p.category.name : '-'}"></td>

                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/admin/products/edit/{id}(id=${p.id})}"
                           th:text="#{admin.edit}">
                            Edit
                        </a>

                        <a class="btn btn-sm btn-outline-danger"
                           th:href="@{/admin/products/delete(id=${p.id})}"
                           th:text="#{admin.delete}">
                            Delete
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
            <div th:if="${products.totalPages >0}" class="pagination"
                th:each="pageNumber :${pageNumbers}">
                <a th:href="@{/admin/products(size=${products.size},page=${pageNumber})}"
                   th:text="${pageNumber}"
                   th:class="${pageNumber==products.number + 1} ? active"></a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
