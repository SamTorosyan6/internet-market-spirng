<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body th:replace="~{fragments/layout :: layout(
        (${mode} == 'edit' ? 'Edit product' : 'Add product'),
        '/admin/products',
        'Back',
        ~{::section}
    )}">

<section>

    <div class="card shadow-sm">
        <div class="card-body">

            <!-- ================= EDIT FORM ================= -->
            <form th:if="${mode} == 'edit'"
                  th:action="@{/admin/products/edit/{id}(id=${product.id})}"
                  method="post" enctype="multipart/form-data">

                <div th:replace="~{::formFields}"></div>
            </form>

            <!-- ================= ADD FORM ================= -->
            <form th:if="${mode} != 'edit'"
                  th:action="@{/admin/products/add}"
                  method="post" enctype="multipart/form-data">

                <div th:replace="~{::formFields}"></div>
            </form>

            <!-- ================= COMMON FIELDS ================= -->
            <div th:fragment="formFields">

                <div class="mb-3">
                    <label class="form-label">Title</label>
                    <input class="form-control" name="title" required
                           th:value="${product.title}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Price</label>
                    <input class="form-control" name="price" type="number"
                           step="0.01" required
                           th:value="${product.price}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" name="description"
                              rows="4"
                              th:text="${product.description}"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <select class="form-select" name="categoryId" required>
                        <option th:each="c : ${categories}"
                                th:value="${c.id}"
                                th:text="${c.name}"
                                th:selected="${product.category != null and product.category.id == c.id}">
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Image</label>

                    <div class="mb-2"
                         th:if="${mode} == 'edit' and product.picName != null">
                        <img th:src="@{/image/get(picName=${product.picName})}"
                             style="width:140px;height:100px;object-fit:cover;border-radius:10px"/>
                        <div class="text-muted small">
                            If you don’t choose a new image, old one stays.
                        </div>
                    </div>

                    <input class="form-control"
                           type="file"
                           name="image"
                           accept="image/*"
                           th:required="${mode} != 'edit'">
                </div>

                <button class="btn btn-dark"
                        th:text="${mode} == 'edit' ? 'Update' : 'Save'">
                    Save
                </button>

            </div>

        </div>
    </div>

</section>
</body>
</html>
