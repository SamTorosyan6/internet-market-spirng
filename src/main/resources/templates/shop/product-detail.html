<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout('Product',
              ${backUrl},
              'Back',
              ~{::section})}">

<section>

    <!-- ================= PRODUCT INFO ================= -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">

            <div class="row g-3">
                <div class="col-md-5">
                    <img th:if="${product.picName != null}"
                         th:src="@{/image/get(picName=${product.picName})}"
                         class="img-fluid rounded"
                         style="width:100%; max-height:360px; object-fit:cover;">
                </div>

                <div class="col-md-7">
                    <h3 th:text="${product.title}"></h3>
                    <div class="fw-bold fs-5 mb-2"
                         th:text="${product.price} + ' դրամ'"></div>

                    <p class="text-muted"
                       th:text="${product.description}"></p>

                    <div class="small text-muted mt-3">
                        Created:
                        <span th:text="${#temporals.format(product.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                    </div>
                </div>
            </div>

        </div>
    </div>


    <!-- ================= COMMENTS ================= -->
    <div class="card shadow-sm">
        <div class="card-body">

            <h5 class="mb-3">Comments</h5>

            <div th:if="${#lists.isEmpty(comments)}"
                 class="text-muted mb-3">
                No comments yet.
            </div>

            <!-- Comment list -->
            <div th:each="c : ${comments}"
                 class="border rounded p-3 mb-3 bg-light">

                <div class="fw-semibold"
                     th:text="${c.user.name}">Username</div>

                <div class="small text-muted mb-2"
                     th:text="${#temporals.format(c.createdAt, 'yyyy-MM-dd HH:mm')}">
                </div>

                <div th:text="${c.comment}"></div>
            </div>

            <!-- ================= ADD COMMENT FORM ================= -->
            <div sec:authorize="isAuthenticated()" class="mt-4">

                <form th:action="@{/products/{id}/comments(id=${product.id})}"
                      method="post">

                    <div class="mb-3">
                        <textarea name="comment"
                                  class="form-control"
                                  rows="3"
                                  maxlength="500"
                                  placeholder="Write your comment..."
                                  required></textarea>
                    </div>

                    <button class="btn btn-dark">Add Comment</button>
                </form>

            </div>

            <div sec:authorize="isAnonymous()" class="mt-3 text-muted">
                Please <a th:href="@{/loginPage}">login</a> to write a comment.
            </div>

        </div>
    </div>

</section>
</html>
