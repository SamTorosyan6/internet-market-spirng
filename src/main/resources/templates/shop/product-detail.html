<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(#{admin.products}, ${backUrl}, null, ~{::body})}">

<body>
<div th:fragment="body">

    <div class="card shadow-sm mb-4">
        <div class="row g-0">

            <div class="col-md-6">
                <img th:if="${product.picName != null}"
                     th:src="@{/image/get(picName=${product.picName})}"
                     class="img-fluid rounded-start"
                     style="height:100%; object-fit:cover;">
            </div>

            <div class="col-md-6">
                <div class="card-body">

                    <h3 th:text="${product.title}">Title</h3>

                    <h5 class="fw-bold"
                        th:text="${product.price} + ' ' + #{product.course}">
                        0 դրամ
                    </h5>

                    <p th:text="${product.description}">Description</p>

                    <div class="small text-muted mt-3">
                        <span th:text="#{product.created}">Created:</span>
                        <span th:text="${#temporals.format(product.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <h5 class="mb-3" th:text="#{products.comments}">Comments</h5>

            <div th:if="${#lists.isEmpty(comments)}"
                 class="text-muted mb-3"
                 th:text="#{products.noCommentsYet}">
                No comments yet.
            </div>

            <div th:each="c : ${comments}" class="border-bottom pb-2 mb-2">
                <div class="fw-bold" th:text="${c.user.name + ' ' + c.user.surname}"></div>
                <div th:text="${c.comment}"></div>
                <div class="small text-muted"
                     th:text="${#temporals.format(c.createdAt, 'yyyy-MM-dd HH:mm')}"></div>
            </div>

            <div sec:authorize="isAuthenticated()">
                <form th:action="@{/products/{id}/comment(id=${product.id})}" method="post">

                    <textarea name="comment"
                              class="form-control mb-2"
                              rows="3"
                              maxlength="500"
                              th:placeholder="#{products.writeYourComment}"
                              required></textarea>

                    <button class="btn btn-dark" th:text="#{products.addComment}">
                        Add Comment
                    </button>
                </form>
            </div>

        </div>
    </div>

</div>
</body>
</html>
