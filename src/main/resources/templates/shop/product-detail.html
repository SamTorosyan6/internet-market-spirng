<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${product.title}">Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <a class="btn btn-outline-dark mb-3" href="javascript:history.back()">Back</a>

    <div class="card shadow-sm">
        <div class="row g-0">
            <div class="col-md-5">
                <img th:if="${product.picName}" th:src="@{/image/get(picName=${product.picName})}"
                     style="width:100%;height:100%;object-fit:cover" />
            </div>
            <div class="col-md-7">
                <div class="card-body p-4">
                    <h2 th:text="${product.title}"></h2>
                    <h4 class="text-muted mb-3" th:text="${product.price + ' AMD'}"></h4>
                    <p th:text="${product.description}"></p>
                    <div class="small text-muted" th:text="${'Created: ' + product.createdAt}"></div>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
