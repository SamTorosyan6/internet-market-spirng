<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Products</h2>
        <a class="btn btn-outline-dark" th:href="@{/categories}">Back</a>
    </div>

    <div class="row g-3">
        <div class="col-md-4" th:each="p : ${products}">
            <a class="card shadow-sm text-decoration-none h-100" th:href="@{/products/{id}(id=${p.id})}">
                <img th:if="${p.picName}" th:src="@{/image/get(picName=${p.picName})}"
                     style="height:200px;object-fit:cover" class="card-img-top">
                <div class="card-body">
                    <h5 class="card-title" th:text="${p.title}"></h5>
                    <div class="text-muted" th:text="${p.price + ' AMD'}"></div>
                </div>
            </a>
        </div>
    </div>

</div>
</body>
</html>
