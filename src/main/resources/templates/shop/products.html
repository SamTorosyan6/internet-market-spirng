<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/categories}">Internet Market</a>

        <div class="ms-auto d-flex gap-2">
            <a class="btn btn-outline-light btn-sm" th:href="@{/categories}">Categories</a>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container py-4">
    <h2 class="mb-3">Products</h2>

    <div th:if="${#lists.isEmpty(products)}" class="alert alert-warning">
        Այս կատեգորիայի մեջ դեռ Product չկա։ Ադմինով ավելացրու product ու ընտրիր այս Category-ն։
    </div>

    <div class="row g-3" th:if="${!#lists.isEmpty(products)}">
        <div class="col-md-4" th:each="p : ${products}">
            <a class="text-decoration-none" th:href="@{/products/{id}(id=${p.id})}">
                <div class="card shadow-sm h-100">
                    <img th:if="${p.picName != null}"
                         th:src="@{/image/get(picName=${p.picName})}"
                         class="card-img-top" style="height:220px; object-fit:cover;">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${p.title}">Title</h5>
                        <p class="card-text text-muted" th:text="${p.description}">Desc</p>
                        <div class="fw-bold" th:text="${p.price} + ' դրամ'">0 դրամ</div>
                    </div>
                </div>
            </a>
        </div>
    </div>

</div>

</body>
</html>
