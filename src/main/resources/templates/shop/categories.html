<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body th:replace="~{fragments/layout :: layout('Categories', null, null, ~{::section})}">
<section>

    <h2 class="mb-3">Categories</h2>

    <div class="row g-3">
        <div class="col-md-4" th:each="c : ${categories}">
            <a class="card shadow-sm text-decoration-none"
               th:href="@{/categories/{id}/products(id=${c.id})}">
                <div class="card-body">
                    <h5 class="mb-0" th:text="${c.name}"></h5>
                </div>
            </a>
        </div>
    </div>

</section>
</body>
</html>
